# Model and Pipeline Configuration for create a plant disease detection project using ml.
# Generated by Coalesce SDLC Engine for CUSTOM-D7ER

project:
  name: "create a plant disease detection project using ml."
  ticket_id: "CUSTOM-D7ER"
  version: "1.0.0"

model:
  architecture: "resnet50"
  weights_pretrained: true
  num_classes: 7
  input_dimensions:
    channels: 3
    height: 224
    width: 224
  confidence_threshold: 0.65

classes:
  - "Healthy Plant (No Disease Detected)"
  - "Early Blight (Alternaria solani)"
  - "Late Blight (Phytophthora infestans)"
  - "Powdery Mildew (Podosphaera pannosa)"
  - "Bacterial Spot (Xanthomonas campestris)"
  - "Leaf Rust (Puccinia triticina)"
  - "Yellow Leaf Curl Virus"

training:
  batch_size: 32
  learning_rate: 0.0001
  optimizer: "Adam"
  loss_function: "CrossEntropyLoss"
  epochs: 25
  early_stopping_patience: 5

inference:
  device: "cpu" # Set to 'cuda' when GPU hardware acceleration is available
  batch_inference: false
  timeout_seconds: 5.0
