<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Multiplayer Tic Tac Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Tic Tac Toe Online</h1>
    <div id="lobby" class="panel">
      <button id="create-btn">Create Room</button>
      <div class="join-group">
        <input type="text" id="room-input" placeholder="Enter Room ID">
        <button id="join-btn">Join Room</button>
      </div>
    </div>
    <div id="game-panel" class="panel hidden">
      <div id="room-info">Room ID: <span id="display-room"></span></div>
      <div id="status">Waiting for opponent...</div>
      <div id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
      <div id="error-msg" class="error"></div>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
